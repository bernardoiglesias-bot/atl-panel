services:
  - type: web
    name: atl-panel
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /healthz
    disk:
      name: datos
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: ATL_DB_PATH
        value: /data/atl.db
      - key: ATL_BACKUP_DIR
        value: /data/respaldos
      - key: ATL_SECRET
        generateValue: true
      - key: ATL_CLAVE_INICIAL
        sync: false
